name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 恢复 debug.keystore
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: Delete older releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release list --limit 100 --json tagName -q '.[1:].[].tagName' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
